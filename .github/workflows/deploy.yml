name: Deploy Sanity Studio to Cloudflare Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Use `npm run build` (not `npx sanity build`) so the package.json
      # `postbuild` script fires and copies _headers + _redirects into dist/.
      - name: Build
        env:
          SANITY_STUDIO_PROJECT_ID: ${{ vars.SANITY_STUDIO_PROJECT_ID }}
          SANITY_STUDIO_DATASET: ${{ vars.SANITY_STUDIO_DATASET }}
          # Presentation tool's preview iframe target (LIVE_PREVIEW_PLAN.md G5/G7).
          # MUST be the same-parent-domain Worker host (preview.sasinfra.com) so the
          # Cloudflare Access cookie is same-site with cms.sasinfra.com and the iframe
          # can authenticate. Without this the config falls back to localhost:4321 and
          # the iframe never loads. Set as a repo variable.
          SANITY_STUDIO_PREVIEW_URL: ${{ vars.SANITY_STUDIO_PREVIEW_URL }}
        run: npm run build

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 659a3f2bef182e72dacb2ae344b2bf8a
          command: pages deploy dist/ --project-name=sasinfra-cms --branch=main --commit-hash=${{ github.sha }}
